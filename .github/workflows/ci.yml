name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml; 3.12 is what the
        # Dockerfile actually ships. Both must work or one of those is a lie.
        python-version: ["3.11", "3.12"]

    env:
      # settings.py refuses to import without this. A dummy is correct here:
      # nothing in the test suite hashes a key that outlives the job.
      API_KEY_PEPPER: ci-dummy-pepper
      ADMIN_TOKEN: ci-dummy-admin-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import every module
        # Runs BEFORE pytest on purpose. A module that cannot be imported is a
        # broken deploy, and this reports it as such instead of as a confusing
        # collection error in an unrelated test file.
        run: python -m scripts.check_imports

      - name: Run tests
        run: pytest -q

  build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds the image without pushing it. Catches the failure mode the test
      # job structurally cannot: a COPY that references a path no longer in the
      # repo, or a requirements pin that will not resolve on python:3.12-slim.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
